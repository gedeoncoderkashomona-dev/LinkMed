[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.16.0"
  # Always install devDependencies (tailwindcss, postcss, autoprefixer, typescript),
  # which next build needs even when NODE_ENV=production is set for the site.
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

